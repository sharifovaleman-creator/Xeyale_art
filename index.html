<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<div class="container">

<h1 id="title">Geri Sayım</h1>

</div>

<div class="box">

<div class="label" id="minutesText">Dəqiqə</div>
</div>

<div class="box">
<div class="number" id="seconds">0</div>
<div class="label" id="secondsText">Saniyə</div>
</div>

</div>
</div>

<div class="buttons">

<a href="iyun.html">
<button id="btn1">Uşaqların Beynəlxalq Müdafiəsi Günü</button>
</a>

<a href="muelif.html">
<button id="btn2">Müəllif haqqında</button>
</a>

<a href="xatireler.html">
<button id="btn3">Sərgidən xatirələr</button>
</a>

<a href="korpe.html">
<button id="btn4">Hansı körpə ruha sahibsiz?</button>
</a>

</div>

<div class="socials">

<a href="https://www.tiktok.com/@xayala.art?_r=1&_t=ZS-96BknG76rFV" target="_blank">
<img src="tiktok.png" alt="">
</a>

<a href="https://www.instagram.com/xayala.art?igsh=OG1kZXZlaGgyNGhz" target="_blank">
<img src="instagram.png" alt="">
</a>

<a href="https://maps.google.com/?q=Ata+Holding+Marneuli" target="_blank">
<img src="map.png" alt="">
</a>

<select id="langSelect"></select>

</div>

<script>

const languages = [
  { code: "az", flag: "🇦🇿" },
  { code: "en", flag: "🇬🇧" },
  { code: "ru", flag: "🇷🇺" },
  { code: "ge", flag: "🇬🇪" },
  { code: "hy", flag: "🇦🇲" }
];

const translations = {
  
  az: {
    title: "Geri Sayım",
    days: "Gün",
    hours: "Saat",
    minutes: "Dəqiqə",
    seconds: "Saniyə",
    
    btn1: "Uşaqların Beynəlxalq Müdafiəsi Günü",
    btn2: "Müəllifin digər rəsmləri",
    btn3: "Sərgidən xatirələr",
    btn4: "Hansı körpə ruha sahibsiz?"
  },
  
  en: {
    title: "Countdown",
    days: "Days",
    hours: "Hours",
    minutes: "Minutes",
    seconds: "Seconds",
    
    btn1: "International Children's Day",
    btn2: "Other artworks by the author",
    btn3: "Memories from the exhibition",
    btn4: "Which child spirit do you have?"
  },
  
  ru: {
    title: "Обратный отсчёт",
    days: "Дни",
    hours: "Часы",
    minutes: "Минуты",
    seconds: "Секунды",
    
    btn1: "Международный день защиты детей",
    btn2: "Другие работы автора",
    btn3: "Воспоминания с выставки",
    btn4: "Какой у тебя детский дух?"
  },
  
  ge: {
    title: "უკუთვლა",
    days: "დღე",
    hours: "საათი",
    minutes: "წუთი",
    seconds: "წამი",
    
    btn1: "ბავშვთა დაცვის საერთაშორისო დღე",
    btn2: "ავტორის სხვა ნამუშევრები",
    btn3: "გამოფენის მოგონებები",
    btn4: "რომელი ბავშვური სული გაქვს?"
  },
  
  hy: {
    title: "Հետհաշվարկ",
    days: "Օր",
    hours: "Ժամ",
    minutes: "Րոպե",
    seconds: "Վայրկյան",
    
    btn1: "Երեխաների պաշտպանության միջազգային օր",
    btn2: "Հեղինակի այլ նկարները",
    btn3: "Հիշողություններ ցուցահանդեսից",
    btn4: "Ի՞նչ մանկական հոգի ունես"
  }
  
};
const select = document.getElementById("langSelect");

languages.forEach(lang => {

  const option = document.createElement("option");

  option.value = lang.code;
  option.textContent = lang.flag;

  select.appendChild(option);

});

let savedLang = localStorage.getItem("lang") || "az";

if(!translations[savedLang]){
  savedLang = "az";
}

select.value = savedLang;

loadLanguage(savedLang);

select.addEventListener("change", () => {

  localStorage.setItem("lang", select.value);

  loadLanguage(select.value);

});

function loadLanguage(lang){

  document.getElementById("title").textContent =
  translations[lang].title;

  document.getElementById("daysText").textContent =
  translations[lang].days;

  document.getElementById("hoursText").textContent =
  translations[lang].hours;

  document.getElementById("minutesText").textContent =
  translations[lang].minutes;

  document.getElementById("secondsText").textContent =
  translations[lang].seconds;

  document.getElementById("btn1").textContent =
  translations[lang].btn1;

  document.getElementById("btn2").textContent =
  translations[lang].btn2;

  document.getElementById("btn3").textContent =
  translations[lang].btn3;

  document.getElementById("btn4").textContent =
  translations[lang].btn4;

}
const targetDate = new Date("may 31, 2026 13:00:00").getTime();

/* TIMER */
function updateTimer() {
   
   const now = new Date().getTime();
   const diff = targetDate - now;
   
   const days = Math.floor(diff / (1000 * 60 * 60 * 24));
   const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
   const minutes = Math.floor((diff / (1000 * 60)) % 60);
   const seconds = Math.floor((diff / 1000) % 60);
   
   document.getElementById("days").innerText = days;
   document.getElementById("hours").innerText = hours;
   document.getElementById("minutes").innerText = minutes;
   document.getElementById("seconds").innerText = seconds;
}

setInterval(updateTimer, 1000);
updateTimer();

</script>

</body>
</html>
