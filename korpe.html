      const select = document.getElementById("langSelect");
      
      languages.forEach(lang => {
         
         const option = document.createElement("option");
         
         option.value = lang.code;
         option.textContent = lang.flag;
         
         select.appendChild(option);
         
      });
      
      let currentLang = localStorage.getItem("lang") || "az";
      
      if (!translations[currentLang]) {
         currentLang = "az";
      }
      
      select.value = currentLang;
      
      loadLanguage(currentLang);
      
      select.addEventListener("change", () => {
         
         currentLang = select.value;
         
         localStorage.setItem("lang", currentLang);
         
         loadLanguage(currentLang);
         
      });
      
      function loadLanguage(lang) {
         
         const t = translations[lang];
         
         document.getElementById("name").placeholder = t.placeholder;
         
         document.getElementById("checkBtn").textContent = t.button;
         
         document.getElementById("backBtn").textContent = t.back;
         
      }
      
      function getIndex(name, len) {
         
         let sum = 0;
         
         for (let i = 0; i < name.length; i++) {
            sum += name.charCodeAt(i);
         }
         
         return sum % len;
         
      }
      
      function check() {
         
         const name = document.getElementById("name").value.trim();
         
         if (!name) return;
         
         const index = getIndex(name.toLowerCase(), images.length);
         
         const text = translations[currentLang].data[index];
         
         document.getElementById("result").innerHTML = `
  
    <img src="${images[index]}"
    style="width:220px;border-radius:16px;margin-top:20px;">
    
    <p style="margin-top:15px;">
      ${name} → ${text}
    </p>
    
  `;
         
      }
