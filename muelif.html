<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tilted Carousel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #e8e5e0;
    --fg: #1a1a1a;
    --muted: #888;
    --card-w: 240px;
    --card-h: 320px;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
    overflow: hidden;
    user-select: none;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 48px;
  }

  .header .tag {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(40px, 7vw, 80px);
    font-weight: 400;
    color: #c0bdb7;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  /* ── Stage ── */
  .stage {
    position: relative;
    width: 100vw;
    height: calc(var(--card-h) + 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
    overflow: visible;
  }

  /* ── Cards ── */
  .card {
    position: absolute;
    width: var(--card-w);
    height: var(--card-h);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    will-change: transform, opacity;
    transition:
      transform 0.65s cubic-bezier(0.76, 0, 0.24, 1),
      opacity   0.65s cubic-bezier(0.76, 0, 0.24, 1),
      box-shadow 0.65s ease;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  /* white border on active */
  .card.active {
    box-shadow: 0 0 0 2px #fff, 0 24px 60px rgba(0,0,0,0.22);
  }

  /* ── Caption ── */
  .caption {
    margin-top: 24px;
    text-align: center;
    height: 40px;
  }

  .caption .label {
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: lowercase;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s, transform 0.4s;
  }

  .caption .label.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .caption .big-label {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(22px, 4vw, 40px);
    font-style: italic;
    color: #c5c2bc;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.5s 0.08s, transform 0.5s 0.08s;
  }

  .caption .big-label.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── Nav ── */
  .nav {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 36px;
  }

  .nav-btn {
    width: 36px;
    height: 36px;
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg);
    transition: background 0.2s, color 0.2s;
  }

  .nav-btn:hover {
    background: var(--fg);
    color: var(--bg);
  }

  .nav-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .dots {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(0,0,0,0.18);
    cursor: pointer;
    transition: background 0.3s, transform 0.3s, width 0.3s;
    border-radius: 3px;
  }

  .dot.active {
    background: var(--fg);
    width: 20px;
  }
  .buttons {
  margin-top: 25px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
}

.buttons button {
  width: 100%;
  padding: 14px 0;
  border-radius: 12px;
  cursor: pointer;
  font-size: 18px;
  font-weight: bold;
  transition: 0.3s ease;
  border: none;
  font-family: 'Georgia', serif;
  /* Afişadakı serif yazı növünə uyğun */
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

/* 1, 3, 5-ci düymələr -> Afişadakı NARINCI tonu */
.buttons button:nth-child(odd) {
  background: linear-gradient(135deg, #EA5413, #FF7E47);
  color: white;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
}
</style>
</head>
<body>


<div class="stage" id="stage"></div>

<div class="caption">
  <div class="label" id="smallLabel">—</div>
  <div class="big-label" id="bigLabel">—</div>
</div>

<div class="nav">
  <button class="nav-btn" id="prevBtn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn">
    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>
   
   <a class="buttons" href="index.html">
      <button id="backBtn">geri</button>
   </a>

<script>
const SLIDES = [
  { src: 'resm1.jpg', label: 'Azadlıq Səsi'},
  { src: 'resm2.jpg', label: 'Uşaqlıq Məsumiyyəti'},
  { src: 'resm3.jpg', label: 'Bahar Enerjisi'},
  { src: 'resm4.jpg', label: 'Çəhrayı Orkideya'},
  { src: 'resm5.jpg', label: 'Bolluq Rəmzi'},
  { src: 'resm6.jpg', label: 'Dostlar Bağda'},
  { src: 'resm7.jpg', label: 'Odlar Yurdu'},
];

const N = SLIDES.length;
let active = 3;
let animating = false;

const stage     = document.getElementById('stage');
const dotsEl    = document.getElementById('dots');
const smallLbl  = document.getElementById('smallLabel');
const bigLbl    = document.getElementById('bigLabel');

// Build cards
const cards = SLIDES.map((s, i) => {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `<img src="${s.src}" alt="${s.label}" loading="lazy">`;
  div.addEventListener('click', () => goTo(i));
  stage.appendChild(div);
  return div;
});

// Build dots
SLIDES.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot';
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
});

// ── Layout ──────────────────────────────────────────
function layout(animate) {
  const cw = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-w'));

  cards.forEach((card, i) => {
    let offset = i - active;
    // wrap around
    if (offset >  N / 2) offset -= N;
    if (offset < -N / 2) offset += N;

    const absOff = Math.abs(offset);

    // Only show -3 to +3
    const visible = absOff <= 3;
    const tx = offset * (cw * 0.58);
    // tilt: side cards rotated, active straight
    const ry = offset === 0 ? 0 : (offset > 0 ? -28 : 28);
    const scale = offset === 0 ? 1 : Math.max(0.62, 1 - absOff * 0.13);
    const tz = -absOff * 80;
    const opacity = offset === 0 ? 1 : Math.max(0, 1 - absOff * 0.28);

    card.style.transition = animate
      ? 'transform 0.65s cubic-bezier(0.76,0,0.24,1), opacity 0.65s ease, box-shadow 0.65s ease'
      : 'none';

    card.style.transform = `translateX(${tx}px) translateZ(${tz}px) rotateY(${ry}deg) scale(${scale})`;
    card.style.opacity   = visible ? opacity : 0;
    card.style.zIndex    = 100 - absOff;
    card.style.pointerEvents = visible ? 'auto' : 'none';
    card.classList.toggle('active', i === active);
  });

  // dots
  Array.from(dotsEl.children).forEach((d, i) => d.classList.toggle('active', i === active));

  // caption
  smallLbl.classList.remove('visible');
  bigLbl.classList.remove('visible');
  setTimeout(() => {
    smallLbl.textContent = SLIDES[active].label;
    bigLbl.textContent   = SLIDES[active].big;
    smallLbl.classList.add('visible');
    bigLbl.classList.add('visible');
  }, animate ? 180 : 0);
}

function goTo(idx) {
  if (animating) return;
  animating = true;
  active = ((idx % N) + N) % N;
  layout(true);
  setTimeout(() => animating = false, 680);
}

function next() { goTo(active + 1); }
function prev() { goTo(active - 1); }

document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft')  prev();
});

// Touch/swipe
let tx0 = 0;
document.addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; });
document.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - tx0;
  if (Math.abs(dx) > 40) dx < 0 ? next() : prev();
});

// Drag on desktop
let drag = false, dragX = 0;
stage.addEventListener('mousedown', e => { drag = true; dragX = e.clientX; });
document.addEventListener('mouseup', e => {
  if (!drag) return;
  drag = false;
  const dx = e.clientX - dragX;
  if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
});

// Init
layout(false);
</script>
</body>
</html>
